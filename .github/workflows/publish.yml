name: publish

# Triggered by the spec repo's promote.yml via repository_dispatch:
#
#   gh api -X POST /repos/.../dispatches \
#     -f event_type=publish \
#     -F client_payload[version]=0.5.0
#
# Verifies the version matches package.json (and concordex.specVersion),
# builds, and publishes with provenance to npm under the @concordex/sdk
# scope.

on:
  repository_dispatch:
    types: [publish]

  # Manual trigger for break-glass / staging republishes.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (must match package.json)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write   # required for npm provenance via OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            VERSION="${{ github.event.client_payload.version }}"
          else
            VERSION="${{ inputs.version }}"
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::no version supplied in dispatch payload"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - name: Setup Node + npm registry
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Verify package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          SPEC_VERSION=$(node -p "require('./package.json').concordex.specVersion")
          if [ "$PKG_VERSION" != "${{ steps.v.outputs.version }}" ]; then
            echo "::error::package.json version $PKG_VERSION != dispatch version ${{ steps.v.outputs.version }}"
            exit 1
          fi
          if [ "$SPEC_VERSION" != "${{ steps.v.outputs.version }}" ]; then
            echo "::error::concordex.specVersion $SPEC_VERSION != dispatch version ${{ steps.v.outputs.version }}"
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Smoke-check dist
        run: |
          test -f dist/esm/index.js
          test -f dist/cjs/index.cjs
          test -f dist/types/index.d.ts

      - name: Publish to npm with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
